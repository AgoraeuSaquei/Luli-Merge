<style>
:root{font-family:'DM Sans',sans-serif;color:#174A4B;background:#F8F1E5}*{box-sizing:border-box}body{margin:0;min-width:320px;background:radial-gradient(#174a4b14 .7px,transparent .7px) 0 0/18px 18px,#F8F1E5}button{font:inherit;cursor:default}header{height:86px;display:flex;align-items:center;justify-content:space-between;padding:18px clamp(18px,5vw,70px);border-bottom:1px solid #174a4b22}.brand{display:flex;align-items:center;gap:10px;font:800 23px 'Baloo 2'}.brand img{width:35px;height:35px;object-fit:contain}.brand b{color:#F05D5E}.topnote{font-size:11px;font-weight:800;letter-spacing:.14em;opacity:.55}.sound{background:#fffaf1;border:0;border-radius:50%;height:40px;width:40px;font-size:20px;color:#174A4B;box-shadow:0 4px 0 #174a4b20}main{width:min(1180px,100%);min-height:calc(100vh - 86px);margin:auto;padding:28px clamp(18px,3.5vw,46px) 56px;display:grid;grid-template-columns:minmax(0,1.06fr) minmax(0,.94fr);align-items:center;gap:clamp(20px,4vw,58px)}.stage{position:relative;aspect-ratio:1/1.02;min-height:430px;isolation:isolate;overflow:hidden;border:3px solid #174A4B;border-radius:40px;background:radial-gradient(circle at 52% 35%,#ffffffdd 0 7%,transparent 54%),radial-gradient(circle at 22% 82%,#ffe18fcc,transparent 43%),linear-gradient(145deg,#D9F4D7 2%,#FFF2C7 60%,#F8C6A1 100%);box-shadow:0 11px 0 #bed1a3,0 24px 42px #174a4b26,inset 0 0 0 5px #ffffff7a}.stage:before{content:'';position:absolute;width:88%;aspect-ratio:1;top:-19%;left:6%;border:2px dashed #174a4b1c;border-radius:50%;box-shadow:0 0 0 45px #ffffff17,0 0 0 95px #ffffff14}.stage:after{content:'';position:absolute;width:80%;height:22px;bottom:4%;left:10%;background:#174a4b29;filter:blur(12px);border-radius:50%;z-index:-1}.logo{position:absolute;width:88%;height:40%;left:6%;top:4%;object-fit:contain;filter:drop-shadow(0 9px 1px #174a4b2b);transform:rotate(-3deg);z-index:5}.jar{position:absolute;top:43%;right:10%;bottom:10%;left:10%;overflow:hidden;border:6px solid #174A4B;border-top-width:10px;bord olor:#698078}.dot{position:absolute;width:10px;height:10px;right:10px;top:10px;border-radius:50%;background:#F05D5E;border:2px solid #FFE4D8}.utilities{display:flex;align-items:center;justify-content:center;gap:26px;padding-top:25px;color:#5F7974;font-size:12px;font-weight:800}.preview{position:fixed;bottom:12px;left:12px;padding:7px 11px;background:#174A4B;color:white;border-radius:8px;font-size:11px;z-index:20;box-shadow:0 3px 8px #0002}
