<!-- index.html -->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Resgatar código</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    input, button { padding: .5rem; font-size: 1rem; }
    .msg { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Resgatar código de card dourado</h1>
  <p>Este formulário envia o código ao servidor que valida e registra o resgate. Os códigos não ficam no cliente.</p>

  <label for="code">Código:</label>
  <input id="code" type="text" placeholder="digite o código" />
  <button id="redeem">Resgatar</button>

  <div class="msg" id="msg"></div>

  <script>
    async function redeem(code) {
      try {
        const res = await fetch('/redeem', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });
        return await res.json();
      } catch (e) {
        return { success: false, message: 'Erro de conexão' };
      }
    }

    document.getElementById('redeem').addEventListener('click', async () => {
      const code = document.getElementById('code').value;
      const msgEl = document.getElementById('msg');
      msgEl.style.color = 'black';
      msgEl.textContent = 'Validando...';
      const res = await redeem(code);
      msgEl.textContent = res.message || 'Resposta inesperada';
      msgEl.style.color = res.success ? 'green' : 'red';
    });
  </script>
</body>
</html>
